name: 'Setup Config Editor Frontend'
description: 'Setup Node.js and install config editor frontend dependencies'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'

    - name: Install frontend dependencies
      shell: bash
      run: |
        cd config-editor
        npm install
